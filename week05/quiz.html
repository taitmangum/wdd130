<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTML and CSS Quiz</title>
    <link rel="stylesheet" href="styles/quiz.css">
</head>

<body>
    <main>
        <h1>HTML and CSS Quiz</h1>

        <form>

            <label for="q1">
                1. Fill in the blank: The CSS property used to change an element's background color
                is __________.
            </label>
            <input type="text" id="q1" name="q1">

            <label for="q2">
                2. Explain the difference between HTML and CSS in your own words.
            </label>
            <textarea id="q2" name="q2" rows="5"></textarea>

            <label for="q3">
                3. Which HTML tag creates the largest heading on a webpage?
            </label>
            <select id="q3" name="q3">
                <option value="" selected disabled>Choose One...</option>
                <option value="h1">h1</option>
                <option value="h3">h3</option>
                <option value="heading">heading</option>
                <option value="title">title</option>
            </select>

            <label for="q4">
                4. How many heading levels are available in HTML?
            </label>
            <input type="number" id="q4" name="q4">

            <button type="submit">Submit Quiz</button>

        </form>
    </main>
</body>

</html>
