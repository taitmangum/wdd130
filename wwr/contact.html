<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us | Canyon Rush Rafting</title>
    <meta name="description"
      content="Contact Canyon Rush Rafting to ask questions, plan a trip, make a reservation, or learn more about our adventures.">
    <meta name="author" content="Tait Mangum">
    <link rel="stylesheet" href="styles/rafting.css">
</head>

<body>

    <header>
        <img src="images/rapids_logo.jpg" alt="Canyon Rush Rafting Logo">

        <nav>
            <a href="index.html">Home</a>
            <a href="about.html">About Us</a>
            <a href="trips.html">Trips</a>
            <a href="contact.html">Contact Us</a>
        </nav>
    </header>

    <main>

        <h1>Contact Canyon Rush Rafting</h1>

        <section class="contact-grid">

            <div class="company-info">
                <h2>Get in Touch</h2>

                <p>125 River Bend Road</p>
                <p>Moab, Utah 84532</p>
                <p>(801) 555-2478</p>
                <p>info@canyonrushrafting.com</p>

                <iframe src="https://www.google.com/maps?q=Moab,Utah&output=embed"
                  title="Map showing Canyon Rush Rafting location" loading="lazy">
                </iframe>
            </div>

            <form class="contact-form">

                <fieldset>

                    <legend>Send Us a Message</legend>

                    <label for="fullname">Name</label>
                    <input type="text" id="fullname" name="fullname" required>

                    <label for="email">Email</label>
                    <input type="email" id="email" name="email" required>

                    <p><strong>Message Purpose</strong></p>

                    <label for="general">
                        <input type="radio" id="general" name="purpose" value="general" required>
                        General Inquiry
                    </label>

                    <label for="reservation">
                        <input type="radio" id="reservation" name="purpose" value="reservation">
                        Reservation Question
                    </label>

                    <label for="suggestion">
                        <input type="radio" id="suggestion" name="purpose" value="suggestion">
                        Website Suggestion
                    </label>

                    <label for="message">Message</label>
                    <textarea id="message" name="message" rows="6" required></textarea>

                    <label for="newsletter">
                        <input type="checkbox" id="newsletter" name="newsletter">
                        Please subscribe me to the monthly newsletter
                    </label>

                    <button type="submit">Send Message to Canyon Rush Rafting</button>

                </fieldset>

            </form>

        </section>

        <section class="employees">

            <h2>We Are Here to Serve You</h2>

            <div class="employee-profiles">

                <figure>
                    <img src="images/employee-1.jpg" alt="Jake Reynolds Lead River Guide">
                    <figcaption>Jake Reynolds — Lead River Guide</figcaption>
                </figure>

                <figure>
                    <img src="images/employee-2.jpg" alt="Sarah Mitchell Reservation Specialist">
                    <figcaption>Sarah Mitchell — Reservation Specialist</figcaption>
                </figure>

                <figure>
                    <img src="images/employee-3.jpg" alt="Tyler Brooks Safety Coordinator">
                    <figcaption>Tyler Brooks — Safety Coordinator</figcaption>
                </figure>

            </div>

        </section>

    </main>

    <footer>

        <p>© 2026 Canyon Rush Rafting | Tait Mangum</p>

        <nav class="socialmedia">

            <a href="https://facebook.com">
                <img src="images/facebook-square.svg" alt="Facebook">
            </a>

            <a href="https://instagram.com">
                <img src="images/instagram-bw.svg" alt="Instagram">
            </a>

            <a href="https://twitter.com">
                <img src="images/twitter.png" alt="Twitter">
            </a>

        </nav>

    </footer>

</body>

</html>
